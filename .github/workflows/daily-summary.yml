name: LynkCo Daily Summary

on:
  # 定时由 cron-job.org 外部触发（北京 20:50），避免 GitHub 内置 schedule 与外部触发重复运行。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LynkCoHelper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Push daily summary to WeChat
        env:
          LYNKCO_PUSHPLUS_TOKEN: ${{ secrets.LYNKCO_PUSHPLUS_TOKEN }}
        run: python lynkco_daily_summary.py
